name: Verify JobTrail
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend tests
        working-directory: backend
        run: bash mvnw -B verify
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests and production build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
  postgres-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and start disposable stack
        env:
          DATABASE_PASSWORD: ci-isolated-database-password
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Verify packaged UI and persistent PostgreSQL profile
        run: python3 scripts/verify-container.py
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=100
        env:
          DATABASE_PASSWORD: ci-isolated-database-password
      - name: Remove disposable CI resources
        if: always()
        run: docker compose down -v
        env:
          DATABASE_PASSWORD: ci-isolated-database-password
