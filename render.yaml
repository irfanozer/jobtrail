services:
  - type: web
    name: jobtrail
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: deploy
      - key: PORT
        value: "8080"
      # Supply the external database JDBC URL with TLS enabled, for example:
      # jdbc:postgresql://your-neon-host/your-database?sslmode=require
      - key: JDBC_DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JOBTRAIL_USERNAME
        value: owner
      # Use a unique password of at least 16 characters.
      - key: JOBTRAIL_PASSWORD
        sync: false
      - key: JOBTRAIL_REFRESH_ON_STARTUP
        value: "false"
      - key: JOBTRAIL_SCHEDULED_REFRESH
        value: "false"
